version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: multi-agent-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multiagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: multi-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the postgres service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/multiagent
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
